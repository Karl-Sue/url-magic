name: PR Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      infra: ${{ steps.filter.outputs.infra }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'api/**'
            infra:
              - 'infra/**'
            frontend:
              - 'client/**'

  python-tests:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      SAFE_BROWSING: ${{ secrets.SAFE_BROWSING }}
      COSMOS_CONTAINER: ${{ secrets.COSMOS_CONTAINER }}
      COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE }}
      COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Check Python code
        run: uv run ruff check .

  terraform-validation:
    name: Terraform validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.5.0'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform environments
        shell: bash
        run: |
          set -euo pipefail
          for environment in dev prod; do
            terraform -chdir="infra/environements/$environment" init -backend=false -input=false
            terraform -chdir="infra/environements/$environment" validate
          done

  frontend-format:
    name: Frontend format check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run lint
        working-directory: client
        run: npm run lint
